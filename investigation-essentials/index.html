<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investigation Essentials for Frontline Supervisors</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="wrapper-body">

  <nav class="top-nav" role="navigation" aria-label="Course navigation">
    <span class="course-title">Investigation Essentials &mdash; the FIND Model</span>
    <div class="module-tabs" role="tablist" aria-label="Course modules">
      <button class="module-tab active" data-module="welcome" role="tab" aria-selected="true" onclick="nav.goToPage('welcome.html')">Intro</button>
      <button class="module-tab" data-module="m1" role="tab" aria-selected="false" onclick="nav.goToPage('m1-01.html')">Role</button>
      <button class="module-tab" data-module="m2" role="tab" aria-selected="false" onclick="nav.goToPage('m2-01.html')">F</button>
      <button class="module-tab" data-module="m3" role="tab" aria-selected="false" onclick="nav.goToPage('m3-01.html')">I</button>
      <button class="module-tab" data-module="m4" role="tab" aria-selected="false" onclick="nav.goToPage('m4-01.html')">N</button>
      <button class="module-tab" data-module="m5" role="tab" aria-selected="false" onclick="nav.goToPage('m5-01.html')">D</button>
      <button class="module-tab" data-module="capstone" role="tab" aria-selected="false" onclick="nav.goToPage('capstone-01.html')">Capstone</button>
      <button class="module-tab" data-module="jobaid" role="tab" aria-selected="false" onclick="nav.goToPage('jobaid.html')">Job Aid</button>
      <button class="module-tab" data-module="completion" role="tab" aria-selected="false" onclick="nav.goToPage('completion.html')">Complete</button>
    </div>
    <img src="Media/logo.png" alt="Maple Leaf Foods" class="nav-logo" onerror="this.style.display='none'">
  </nav>

  <div class="progress-bar-wrap" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Course progress">
    <div class="progress-fill" id="progress-fill"></div>
  </div>

  <iframe id="content-frame" class="content-frame" src="pages/welcome.html" title="Course content" aria-label="Course page content"></iframe>

  <div class="bottom-nav">
    <span class="progress-text" id="progress-text">0% Complete</span>
    <div class="nav-buttons">
      <button class="btn btn-secondary" id="btn-prev" onclick="nav.goPrev()" disabled aria-label="Previous page">&larr; Back</button>
      <button class="btn btn-primary" id="btn-next" onclick="nav.goNext()" aria-label="Next page">Next &rarr;</button>
    </div>
  </div>

  <script src="js/scorm-wrapper.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/nav.js"></script>
  <script>
    scormAPI.initialize();
    nav.init();
    window.addEventListener('message', function (e) {
      if (!e.data || !window.scoring) return;
      if (e.data.type === 'moduleScore') { scoring.setModuleScore(e.data.module, e.data.earned, e.data.possible); }
      if (e.data.type === 'addModulePoints') { scoring.addPoints(e.data.module, e.data.earned, e.data.possible); }
    });
    window.addEventListener('beforeunload', function () { scormAPI.terminate(); });
  </script>
</body>
</html>
